plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'eclipse'
}

group = 'etri'
version = System.getenv("MDT_BUILD_VERSION") ?: "unknown"

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
configurations {
	all {
		exclude group: 'commons-logging', module: 'commons-logging'
	}
}

repositories {
	mavenCentral()
}
dependencies {
	implementation project(":utils")
	implementation project(":mdt-client")

	// @Nullable, @GuardedBy
	compileOnly libs.findbugs.jsr305

	// AAS model
//	implementation "org.eclipse.digitaltwin.aas4j:aas4j-dataformat-json:${aas4j_version}"
//	implementation "org.eclipse.digitaltwin.aas4j:aas4j-dataformat-aasx:${aas4j_version}"

	// HTTP Client
	implementation libs.okhttp

    // SpringBoot dependencies
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	implementation libs.springdoc.webmvc.ui
	
	// MQTT
	implementation libs.paho.mqttv3
	
	// Docker Java Binding
	implementation libs.docker.client
	// Jersey는 Spring Boot가 버전을 관리한다(docker-client가 쓰는 HTTP 통신 구현).
	implementation "org.glassfish.jersey.core:jersey-client"
	implementation "org.glassfish.jersey.connectors:jersey-apache-connector"
	implementation "org.glassfish.jersey.media:jersey-media-json-jackson"
	implementation "org.glassfish.jersey.inject:jersey-hk2"
	
	// Kubernetes client
	implementation libs.fabric8.kubernetes.client
}

bootJar {
	archiveClassifier = 'all'
	mainClass = 'mdt.MDTInstanceApplication'
}

eclipse {
	classpath {
		file {
			whenMerged { cp ->
				def linkedProjectBuildLibDirs = []
				if (cp.entries.any { it.kind == 'src' && it.path == '/mdt-client' }) {
					linkedProjectBuildLibDirs << project(':mdt-client').projectDir.toPath().resolve('build/libs').toUri().getPath().replaceAll('/+$', '')
				}
				if (cp.entries.any { it.kind == 'src' && it.path == '/utils' }) {
					linkedProjectBuildLibDirs << project(':utils').projectDir.toPath().resolve('build/libs').toUri().getPath().replaceAll('/+$', '')
				}
				cp.entries.removeAll { entry ->
					entry.kind == 'lib'
						&& entry.path != null
						&& linkedProjectBuildLibDirs.any { dir -> entry.path.startsWith(dir + '/') }
				}
				cp.entries.each { entry ->
					if (entry.kind == 'src' && entry.path == 'src/main/resources') {
						entry.excludes = []
					}
					if (entry.kind == 'src' && entry.path == 'src/test/resources') {
						entry.excludes = []
					}
				}
			}
		}
	}
}